<!DOCTYPE html>
<html lang="en">

</head>
<body>
    <h1><!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>A Letter</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Patrick+Hand&family=Playfair+Display&family=Cormorant+Garamond&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:Inter;
  background:#f8f8f8;
  color:#111;
}

header{
  text-align:center;
  padding:30px 20px;
  font-size:34px;
  position:relative;
}

.container{
  max-width:500px;
  margin:auto;
  padding:10px;
}

input,textarea,select{
  width:100%;
  padding:10px;
  margin:8px 0;
  border-radius:8px;
  border:1px solid #ddd;
}

button{
  width:100%;
  background:black;
  color:white;
  padding:12px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.envelope{
  background:white;
  border-radius:12px;
  margin:15px 0;
  box-shadow:0 4px 20px rgba(0,0,0,0.05);
  overflow:hidden;
  cursor:pointer;
}

.envelope-front{
  padding:16px;
  border-bottom:1px solid #eee;
}

.envelope-inside{
  display:none;
  padding:18px;
}
</style>
</head>

<body>

<header>A Letter</header>

<div class="container">

<h3>Send a Letter</h3>

<input type="text" id="to" placeholder="To">
<input type="text" id="from" placeholder="From">
<textarea id="message" placeholder="Write your letter..."></textarea>

<select id="fontChoice">
  <option value="Inter">Minimal</option>
  <option value="'Patrick Hand'">Handwritten</option>
  <option value="'Playfair Display'">Elegant</option>
  <option value="'Cormorant Garamond'">Classic</option>
</select>

<input type="text" id="spotify" placeholder="Spotify track link">
<button onclick="submitLetter()">Send Letter</button>

<hr>

<h3>Browse Letters</h3>
<div id="letters"></div>

</div>

<!-- Firebase -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "PASTE_YOURS_HERE",
  authDomain: "PASTE_YOURS_HERE",
  projectId: "PASTE_YOURS_HERE",
  storageBucket: "PASTE_YOURS_HERE",
  messagingSenderId: "PASTE_YOURS_HERE",
  appId: "PASTE_YOURS_HERE"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const lettersRef = collection(db, "letters");

window.submitLetter = async function(){

  let to = document.getElementById("to").value;
  let from = document.getElementById("from").value;
  let message = document.getElementById("message").value;
  let spotify = document.getElementById("spotify").value;
  let font = document.getElementById("fontChoice").value;

  let trackId = spotify.split("track/")[1]?.split("?")[0];

  if(!trackId) return alert("Invalid Spotify link");

  await addDoc(lettersRef, {
    to,
    from,
    message,
    trackId,
    font,
    created: Date.now()
  });

  document.getElementById("to").value="";
  document.getElementById("from").value="";
  document.getElementById("message").value="";
  document.getElementById("spotify").value="";
};

const q = query(lettersRef, orderBy("created", "desc"));

onSnapshot(q, (snapshot)=>{
  const container = document.getElementById("letters");
  container.innerHTML="";

  snapshot.forEach(doc=>{
    const letter = doc.data();

    const div = document.createElement("div");
    div.className="envelope";

    div.innerHTML=`
      <div class="envelope-front">To: ${letter.to}</div>
      <div class="envelope-inside" style="font-family:${letter.font}">
        <p><strong>From:</strong> ${letter.from}</p>
        <p>${letter.message}</p>
        <iframe style="border-radius:12px"
        src="https://open.spotify.com/embed/track/${letter.trackId}?autoplay=1"
        width="100%" height="80" frameBorder="0"
        allow="autoplay; encrypted-media">
        </iframe>
      </div>
    `;

    div.onclick = ()=>{
      const inside = div.querySelector(".envelope-inside");
      inside.style.display =
        inside.style.display==="block" ? "none" : "block";
    };

    container.appendChild(div);
  });

});

</script>

</body>
</html>
